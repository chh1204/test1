<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Speed Clicker</h1>
        <div class="game-info">
            <div class="timer-container">
                <span class="timer-label">Time:</span>
                <span id="timer">0.00</span>
            </div>
            <div class="best-time-container">
                <span class="best-time-label">Best:</span>
                <span id="best-time">--</span>
            </div>
        </div>
        <div id="game-board" class="game-board">
        </div>
        <button id="start-btn" class="start-btn">Start</button>
        <div id="result-display" class="result-display"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
